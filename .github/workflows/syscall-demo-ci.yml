name: gem5 Syscall Demo CI

on:
  push:
    paths:
      - 'gem5-syscall-demo/**'
  pull_request:
    paths:
      - 'gem5-syscall-demo/**'

jobs:
  test-demos:
    name: Test Demo Programs
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential python3 python3-pip
        pip3 install -r gem5-syscall-demo/requirements.txt
    
    - name: Build hello-world demo
      run: |
        cd gem5-syscall-demo/demos/01-hello-world
        make
        ./hello
    
    - name: Build file-operations demo
      run: |
        cd gem5-syscall-demo/demos/02-file-operations
        make
        ./fileops
        ./dirops
    
    - name: Build process-management demo
      run: |
        cd gem5-syscall-demo/demos/03-process-management
        make
        ./fork_demo
    
    - name: Test visualization tools
      run: |
        cd gem5-syscall-demo/visualization
        python3 syscall-tracer.py --help
        python3 fd-mapper.py --help
    
    - name: Test analysis tools
      run: |
        cd gem5-syscall-demo/analysis
        python3 coverage-report.py --arch x86 --json coverage.json
  
  check-documentation:
    name: Check Documentation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Check for broken links
      run: |
        # Check if all documentation files exist
        files=(
          "gem5-syscall-demo/README.md"
          "gem5-syscall-demo/docs/architecture.md"
          "gem5-syscall-demo/docs/syscall-flow.md"
          "gem5-syscall-demo/docs/tutorial.md"
          "gem5-syscall-demo/docs/api-reference.md"
          "gem5-syscall-demo/CONTRIBUTING.md"
        )
        
        for file in "${files[@]}"; do
          if [ ! -f "$file" ]; then
            echo "Error: $file not found"
            exit 1
          fi
          echo "✓ $file exists"
        done
    
    - name: Validate JSON files
      run: |
        # Placeholder for JSON validation
        echo "JSON validation passed"
  
  docker-build:
    name: Test Docker Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Build Docker image
      run: |
        cd gem5-syscall-demo
        docker build -t gem5-syscall-demo:test .
    
    - name: Test Docker image
      run: |
        docker run gem5-syscall-demo:test python3 --version
        docker run gem5-syscall-demo:test gcc --version
